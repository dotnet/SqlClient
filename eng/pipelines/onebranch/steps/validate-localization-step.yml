steps:
  - task: PowerShell@2
    displayName: 'Validate localized resources'
    inputs:
      targetType: filePath
      pwsh: true
      filePath: $(Build.SourcesDirectory)/eng/pipelines/onebranch/scripts/validate-localization.ps1
      arguments: >-
        -ResourcesDirectory "$(Build.SourcesDirectory)/src/Microsoft.Data.SqlClient/src/Resources"
