#
# Opens a GitHub PR that bumps SqlClientNextVersion after the SqlClient family is published to
# NuGet Production. See eng/pipelines/onebranch/scripts/new-version-bump-pr.ps1 for the rules.
#
# The stage is emitted only for production SqlClient releases, and it runs only when the release
# stage succeeds, so a rejected or failed release never opens a PR.
#
# Requires the "GitHub PAT Tokens" variable group, whose secret PATToken must allow contents,
# pull request, and issue writes on dotnet/SqlClient.

parameters:
  - name: releaseToProduction
    type: boolean

  - name: releaseSqlClient
    type: boolean

  # The release stage this stage waits for.
  - name: releaseStageName
    type: string
    default: release_production

stages:
  - ${{ if and(eq(parameters.releaseToProduction, true), eq(parameters.releaseSqlClient, true)) }}:
    - stage: version_bump_pr
      displayName: "Open Version Bump PR"
      dependsOn: ${{ parameters.releaseStageName }}
      condition: succeeded()

      jobs:
        - job: version_bump_pr_job
          displayName: "Open GitHub version bump PR"
          pool:
            type: linux

          variables:
            - group: 'GitHub PAT Tokens'
            - name: scriptPath
              value: eng/pipelines/onebranch/scripts/new-version-bump-pr.ps1
            - name: versionsPropsPath
              value: src/Microsoft.Data.SqlClient/Versions.props
            - name: ob_outputDirectory
              value: $(Build.SourcesDirectory)/no_publish
            # Disable all SDL scanning: this job only calls the GitHub API.
            - name: ob_sdl_apiscan_enabled
              value: false
            - name: ob_sdl_binskim_break
              value: false
            - name: ob_sdl_binskim_enabled
              value: false
            - name: ob_sdl_sbom_enabled
              value: false

          steps:
            - pwsh: |
                New-Item -Path "$(ob_outputDirectory)" -ItemType Directory -Force
                "**" | Out-File -FilePath "$(ob_outputDirectory)/.artifactignore" -Encoding ascii
              displayName: 'Suppress artifact publishing'

            - task: PowerShell@2
              displayName: "Open version bump PR"
              inputs:
                targetType: filePath
                pwsh: true
                filePath: $(Build.SourcesDirectory)/$(scriptPath)
                arguments: >-
                  -SourceBranch "$(Build.SourceBranch)"
                  -VersionsPropsPath "$(Build.SourcesDirectory)/$(versionsPropsPath)"
              env:
                # Secrets are not exposed to scripts unless mapped explicitly.
                GITHUB_TOKEN: $(PATToken)
