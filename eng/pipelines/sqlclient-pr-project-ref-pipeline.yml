# Temporary, manually triggered experiment for validating that the
# dotnetMSI-managed-identity service connection can list Azure Key Vault keys.

name: akv-service-connection-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - group: sqlclient-pipeline-config-v1
  - group: ADO Test Configuration Properties

jobs:
  - job: list_azure_key_vault_keys
    displayName: List Azure Key Vault key names
    timeoutInMinutes: 10
    pool:
      name: $(general_purpose_pool_name)
      demands:
        - imageOverride -equals ADO-UB24

    steps:
      - task: AzureCLI@2
        displayName: List Azure Key Vault key names
        env:
          AZURE_KEY_VAULT_URL: $(AzureKeyVaultUrl)
        inputs:
          azureSubscription: dotnetMSI-managed-identity
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'

            $vaultUrl = $env:AZURE_KEY_VAULT_URL
            if ([string]::IsNullOrWhiteSpace($vaultUrl)) {
                throw 'AzureKeyVaultUrl is not configured.'
            }

            $uri = $null
            if (-not [Uri]::TryCreate($vaultUrl, [UriKind]::Absolute, [ref]$uri) -or
                $uri.Scheme -ne [Uri]::UriSchemeHttps -or
                -not $uri.IsDefaultPort -or
                -not [string]::IsNullOrEmpty($uri.UserInfo) -or
                -not [string]::IsNullOrEmpty($uri.Query) -or
                -not [string]::IsNullOrEmpty($uri.Fragment) -or
                $uri.AbsolutePath.Trim('/') -ne '') {
                throw 'AzureKeyVaultUrl must be an HTTPS Azure Key Vault base URL.'
            }

            if ($uri.DnsSafeHost -notmatch '^(?<vaultName>[a-zA-Z0-9-]+)\.vault\.azure\.net$') {
                throw 'AzureKeyVaultUrl must use the public Azure Key Vault domain.'
            }

            $accessToken = az account get-access-token `
                --resource https://vault.azure.net `
                --query accessToken `
                --output tsv

            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
                throw 'The service connection could not acquire an Azure Key Vault access token.'
            }

            $httpClient = [System.Net.Http.HttpClient]::new()
            try {
                $httpClient.Timeout = [TimeSpan]::FromSeconds(30)
                $httpClient.DefaultRequestHeaders.Authorization =
                    [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $accessToken)

                $keysUrl = [Uri]::new($uri, 'keys?api-version=7.4')
                try {
                    $response = $httpClient.GetAsync($keysUrl).GetAwaiter().GetResult()
                }
                catch [System.Threading.Tasks.TaskCanceledException] {
                    throw "Timed out after 30 seconds connecting to $($uri.DnsSafeHost). Check the Key Vault firewall, private endpoint, DNS, and agent network route."
                }

                $responseBody = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                if (-not $response.IsSuccessStatusCode) {
                    $errorCode = 'Unknown'
                    $errorMessage = $response.ReasonPhrase
                    try {
                        $errorResponse = $responseBody | ConvertFrom-Json
                        if ($errorResponse.error.code) {
                            $errorCode = $errorResponse.error.code
                        }
                        if ($errorResponse.error.message) {
                            $errorMessage = $errorResponse.error.message
                        }
                    }
                    catch [System.ArgumentException] {
                        # Preserve the HTTP status when the service returns a non-JSON error.
                    }

                    throw "Azure Key Vault returned HTTP $([int]$response.StatusCode) ($errorCode): $errorMessage"
                }

                $keyNames = ($responseBody | ConvertFrom-Json).value |
                    ForEach-Object { ([Uri]$_.kid).Segments[2].TrimEnd('/') } |
                    Sort-Object -Unique

                if ($keyNames.Count -eq 0) {
                    Write-Host 'The service connection can access the vault, but it contains no keys.'
                }
                else {
                    $keyNames | ForEach-Object {
                        Write-Host $_
                    }
                }
            }
            finally {
                $httpClient.Dispose()
            }
