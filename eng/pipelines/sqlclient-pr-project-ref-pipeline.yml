# Temporary, manually triggered experiment for validating that the
# dotnetMSI-managed-identity service connection can list Azure Key Vault keys.

name: akv-service-connection-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  - group: sqlclient-pipeline-config-v1
  - group: ADO Test Configuration Properties

jobs:
  - job: list_azure_key_vault_keys
    displayName: List Azure Key Vault key names
    timeoutInMinutes: 10
    pool:
      name: $(general_purpose_pool_name)
      demands:
        - imageOverride -equals ADO-UB24

    steps:
      - task: AzureCLI@2
        displayName: List Azure Key Vault key names
        env:
          AZURE_KEY_VAULT_URL: $(AzureKeyVaultUrl)
        inputs:
          azureSubscription: dotnetMSI-managed-identity
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'

            $vaultUrl = $env:AZURE_KEY_VAULT_URL
            if ([string]::IsNullOrWhiteSpace($vaultUrl)) {
                throw 'AzureKeyVaultUrl is not configured.'
            }

            $uri = $null
            if (-not [Uri]::TryCreate($vaultUrl, [UriKind]::Absolute, [ref]$uri) -or
                $uri.Scheme -ne [Uri]::UriSchemeHttps -or
                -not $uri.IsDefaultPort -or
                -not [string]::IsNullOrEmpty($uri.UserInfo) -or
                -not [string]::IsNullOrEmpty($uri.Query) -or
                -not [string]::IsNullOrEmpty($uri.Fragment) -or
                $uri.AbsolutePath.Trim('/') -ne '') {
                throw 'AzureKeyVaultUrl must be an HTTPS Azure Key Vault base URL.'
            }

            if ($uri.DnsSafeHost -notmatch '^(?<vaultName>[a-zA-Z0-9-]+)\.vault\.azure\.net$') {
                throw 'AzureKeyVaultUrl must use the public Azure Key Vault domain.'
            }

            $keyNames = az keyvault key list `
                --vault-name $Matches.vaultName `
                --query '[].name' `
                --output tsv

            if ($LASTEXITCODE -ne 0) {
                throw "Failed to list keys from Azure Key Vault (exit code $LASTEXITCODE)."
            }

            $keyNames | Sort-Object -Unique | ForEach-Object {
                Write-Host $_
            }
