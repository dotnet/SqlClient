# Defines separate Windows and Linux Kerberos test stages.

parameters:

  - name: buildConfiguration
    type: string
    values:
      - Debug
      - Release

  - name: debug
    type: boolean

  - name: dotnetVerbosity
    type: string
    values:
      - quiet
      - minimal
      - normal
      - detailed
      - diagnostic

  - name: netFrameworkTestRuntimes
    type: object
    default: [net462]

  - name: netTestRuntimes
    type: object
    default: [net8.0, net9.0, net10.0]

stages:

  - stage: windows
    displayName: Windows
    dependsOn: []
    variables:
      - group: kv-sqldrivers-shared
    jobs:

      # .NET Framework uses native SNI.
      - ${{ each runtime in parameters.netFrameworkTestRuntimes }}:
        - template: /eng/pipelines/ci/kerberos/sqlclient-ci-kerberos-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Win : Native SNI : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: windows_native_sni_${{ replace(runtime, '.', '_') }}
            operatingSystem: Windows
            poolName: ADO-Trusted-Domain-Win-WestUS2
            runtime: ${{ runtime }}
            useManagedSNI: false
            vmImage: ADO-Win25

      # .NET runs with both native and managed SNI.
      - ${{ each runtime in parameters.netTestRuntimes }}:
        - template: /eng/pipelines/ci/kerberos/sqlclient-ci-kerberos-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Win : Native SNI : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: windows_native_sni_${{ replace(runtime, '.', '_') }}
            operatingSystem: Windows
            poolName: ADO-Trusted-Domain-Win-WestUS2
            runtime: ${{ runtime }}
            useManagedSNI: false
            vmImage: ADO-Win25

        - template: /eng/pipelines/ci/kerberos/sqlclient-ci-kerberos-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Win : Managed SNI : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: windows_managed_sni_${{ replace(runtime, '.', '_') }}
            operatingSystem: Windows
            poolName: ADO-Trusted-Domain-Win-WestUS2
            runtime: ${{ runtime }}
            useManagedSNI: true
            vmImage: ADO-Win25

  - stage: linux
    displayName: Linux
    dependsOn: []
    variables:
      - group: kv-sqldrivers-shared
    jobs:

      # Managed SNI is always used on non-Windows platforms.
      - ${{ each runtime in parameters.netTestRuntimes }}:
        - template: /eng/pipelines/ci/kerberos/sqlclient-ci-kerberos-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Linux : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: linux_${{ replace(runtime, '.', '_') }}
            operatingSystem: Linux
            poolName: ADO-Trusted-Linux-WestUS2
            runtime: ${{ runtime }}
            vmImage: ADO-UB24
