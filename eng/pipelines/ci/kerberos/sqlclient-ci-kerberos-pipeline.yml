# Kerberos authentication integration tests for Microsoft.Data.SqlClient. The tests consume the
# packages produced by sqlclient-ci-package and run on domain-connected Windows and Linux agents.
#
# Job breakdown:
#   - Windows: net462 with native SNI, plus net8/9/10 with native and managed SNI (7 jobs).
#   - Linux: net8/9/10 with managed SNI (3 jobs).
#   - Coverage: merge reports from all test jobs (1 job).

name: $(date:yyyyMMdd)$(rev:.r)

# Do not trigger this pipeline for PRs or commits.
trigger: none
pr: none

# Pipeline completion triggers are evaluated using the branch filters in this pipeline's "Default
# branch for manual and scheduled builds" definition. Because both pipelines use the same
# repository, an eligible run executes this YAML from the triggering package run's branch and
# commit, preserving branch-specific pipeline definitions.
resources:
  pipelines:
    - pipeline: sqlclient-ci-package
      source: sqlclient-ci-package
      trigger: true

parameters:

  - name: buildConfiguration
    displayName: Test Build Configuration
    type: string
    default: Release
    values:
      - Debug
      - Release

  - name: debug
    displayName: Enable debug output
    type: boolean
    default: false

  - name: dotnetVerbosity
    displayName: dotnet CLI Verbosity
    type: string
    default: normal
    values:
      - quiet
      - minimal
      - normal
      - detailed
      - diagnostic

variables:

  # Kerberos environment settings shared by all jobs. KerberosDomainPassword resolves from the
  # kv-sqldrivers-shared variable group imported by each OS stage.
  - name: KerberosDomain
    value: sqldrv.ad

  - name: KerberosDomainOU
    value: agents

  - name: KerberosDomainUser
    value: agent

  - name: KerberosDomainPassword
    value: $(agent-at-sqldrv-ad)

  - name: REMOTE_TCP_CONN_STRING
    value: Data Source=tcp:sqldrv-sql22.sqldrv.ad\sql2022;Initial Catalog=Northwind;Integrated Security=true;Encrypt=false;TrustServerCertificate=true

  - name: REMOTE_NP_CONN_STRING
    value: Data Source=np:sqldrv-sql22.sqldrv.ad\sql2022;Initial Catalog=Northwind;Integrated Security=true;Encrypt=false;TrustServerCertificate=true

stages:
  - template: /eng/pipelines/ci/kerberos/sqlclient-ci-kerberos-stages.yml@self
    parameters:
      buildConfiguration: ${{ parameters.buildConfiguration }}
      debug: ${{ parameters.debug }}
      dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
