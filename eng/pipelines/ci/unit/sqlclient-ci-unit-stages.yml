# Defines the Windows, Linux, and macOS matrices for SqlClient Unit and Functional tests.

parameters:

  # The build configuration to use when building the test projects.
  - name: buildConfiguration
    type: string
    values:
      - Debug
      - Release

  # True to emit debug information and steps.
  - name: debug
    type: boolean

  # The verbosity level for dotnet CLI commands.
  - name: dotnetVerbosity
    type: string
    values:
      - quiet
      - minimal
      - normal
      - detailed
      - diagnostic

  # The .NET Framework runtimes to test on Windows.
  - name: netFrameworkTestRuntimes
    type: object
    default: [net462]

  # The .NET runtimes to test on Windows, Linux, and macOS.
  - name: netTestRuntimes
    type: object
    default: [net8.0, net9.0, net10.0]

stages:

  # TODO: Add more Windows and Linux images as they are created per the
  # [1ES Image Plan - Overview](https://sqlclientdrivers.visualstudio.com/ADO.Net/_wiki/wikis/ADO.Net.wiki/346/1ES-Image-Plan).

  # Run the Windows runtime and SNI matrix.
  - stage: windows
    displayName: Windows
    dependsOn: []
    jobs:

      # .NET Framework uses native SNI.
      - ${{ each runtime in parameters.netFrameworkTestRuntimes }}:
        # Run the .NET Framework tests with native SNI.
        - template: /eng/pipelines/ci/unit/sqlclient-ci-unit-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Win : Native SNI : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: windows_native_sni_${{ replace(runtime, '.', '_') }}
            operatingSystem: Windows
            runtime: ${{ runtime }}
            useManagedSni: false
            vmImage: ADO-Win25

      # .NET runs with both native and managed SNI.
      - ${{ each runtime in parameters.netTestRuntimes }}:
        # Run the .NET tests with native SNI.
        - template: /eng/pipelines/ci/unit/sqlclient-ci-unit-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Win : Native SNI : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: windows_native_sni_${{ replace(runtime, '.', '_') }}
            operatingSystem: Windows
            runtime: ${{ runtime }}
            useManagedSni: false
            vmImage: ADO-Win25

        # Run the .NET tests with managed SNI.
        - template: /eng/pipelines/ci/unit/sqlclient-ci-unit-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Win : Managed SNI : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: windows_managed_sni_${{ replace(runtime, '.', '_') }}
            operatingSystem: Windows
            runtime: ${{ runtime }}
            useManagedSni: true
            vmImage: ADO-Win25

  # Run the Linux runtime matrix with managed SNI.
  - stage: linux
    displayName: Linux
    dependsOn: []
    jobs:

      # Managed SNI is always used on non-Windows platforms.
      - ${{ each runtime in parameters.netTestRuntimes }}:
        # Run the .NET tests on Linux.
        - template: /eng/pipelines/ci/unit/sqlclient-ci-unit-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'Linux : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: linux_${{ replace(runtime, '.', '_') }}
            operatingSystem: Linux
            runtime: ${{ runtime }}
            vmImage: ADO-UB24

  # Run the macOS runtime matrix with managed SNI.
  - stage: macos
    displayName: macOS
    dependsOn: []
    jobs:

      # Managed SNI is always used on non-Windows platforms.
      - ${{ each runtime in parameters.netTestRuntimes }}:
        # Run the .NET tests on a Microsoft-hosted macOS agent.
        - template: /eng/pipelines/ci/unit/sqlclient-ci-unit-job.yml@self
          parameters:
            buildConfiguration: ${{ parameters.buildConfiguration }}
            debug: ${{ parameters.debug }}
            displayName: 'macOS : ${{ runtime }}'
            dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
            jobNameSuffix: macos_${{ replace(runtime, '.', '_') }}
            operatingSystem: macOS
            runtime: ${{ runtime }}
            vmImage: macos-latest
