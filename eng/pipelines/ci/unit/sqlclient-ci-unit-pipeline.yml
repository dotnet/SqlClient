# This pipeline runs the SqlClient Unit and Functional test suites in "Package" mode against the
# NuGet packages produced by sqlclient-ci-package. It is triggered by successful runs of that
# pipeline.
#
# This pipeline is defined in both the Public and ADO.Net projects, but it is only triggered by the
# sqlclient-ci-package pipeline in the same project.

name: $(DayOfYear)$(Rev:rr)

pr: none
trigger: none

# The resource branch filters limit completion triggers to the intended upstream branches. Because
# both pipelines use the same repository, an eligible run executes this YAML from the triggering
# package run's branch and commit, preserving branch-specific pipeline definitions.
resources:
  pipelines:
    - pipeline: sqlclient-ci-package
      source: sqlclient-ci-package
      trigger:
        branches:
          include:
            - main
            - internal/main

parameters:

  # The build configuration to use when building the test projects.
  - name: buildConfiguration
    displayName: Test Build Configuration
    type: string
    default: Release
    values:
      - Debug
      - Release

  # True to emit debug information and steps.
  - name: debug
    displayName: Enable debug output
    type: boolean
    default: false

  # The verbosity level for dotnet CLI commands.
  - name: dotnetVerbosity
    displayName: dotnet CLI Verbosity
    type: string
    default: normal
    values:
      - quiet
      - minimal
      - normal
      - detailed
      - diagnostic

stages:
  # Run the Unit and Functional test matrices on Windows, Linux, and macOS.
  - template: /eng/pipelines/ci/unit/sqlclient-ci-unit-stages.yml@self
    parameters:
      buildConfiguration: ${{ parameters.buildConfiguration }}
      debug: ${{ parameters.debug }}
      dotnetVerbosity: ${{ parameters.dotnetVerbosity }}
