# This template downloads the driver strong-name signing key from ADO secure files.  This key is
# used to sign the shipping driver assemblies.
#
# The secure file is only available to the internal ADO.Net project, so this template must only be
# used by internal builds.
#
# Downstream steps reference the key's path via:
#
#   $(driverKeyFile.secureFilePath)

steps:

  - task: DownloadSecureFile@1
    displayName: Download Driver Signing Key
    inputs:
      secureFile: netfxKeypair.snk
    name: driverKeyFile
