# Call after installing the .NET SDK, before scripts that consume modules.
steps:
  - script: dotnet tool restore
    displayName: Restore .NET Tools
    workingDirectory: $(Build.SourcesDirectory)

  - script: dotnet build tools/targets/RestorePowerShellModules.targets -t:RestorePowerShellModules -nologo -v:minimal
    displayName: Restore PowerShell Modules
    workingDirectory: $(Build.SourcesDirectory)
