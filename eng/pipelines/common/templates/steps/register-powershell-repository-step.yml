# Register once per job, before module installs, under the same user as the consumers.
# NuGet.config's governed source is the single feed-address configuration.
parameters:
  # Literal name, not a runtime $(variable). Escape quotes before inserting it into PowerShell.
  - name: repositoryName
    type: string

steps:
  - ${{ if contains(parameters.repositoryName, '$(') }}:
    - 'repositoryName must be a literal template parameter, not a runtime variable': error

  - pwsh: |
      & "$(Build.SourcesDirectory)/eng/scripts/Register-SqlClientPSRepository.ps1" -RepositoryName '${{ replace(parameters.repositoryName, '''', '''''') }}'
    displayName: Register governed PowerShell repository
