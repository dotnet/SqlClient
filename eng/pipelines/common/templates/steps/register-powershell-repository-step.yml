# Register once per job, before module installs, under the same user as the consumers.
# NuGet.config's governed source is the single feed-address configuration.
parameters:
  - name: repositoryName
    type: string

steps:
  - pwsh: |
      & "$(Build.SourcesDirectory)/eng/scripts/Register-SqlClientPSRepository.ps1" -RepositoryName $env:POWERSHELL_REPOSITORY_NAME
    displayName: Register governed PowerShell repository
    env:
      POWERSHELL_REPOSITORY_NAME: ${{ parameters.repositoryName }}
