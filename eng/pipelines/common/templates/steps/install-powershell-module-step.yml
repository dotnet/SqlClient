# Module inputs are literal template parameters, not runtime $(variables).
parameters:
  - name: name
    type: string
  - name: requiredVersion
    type: string
    default: ''
  - name: skipIfInstalled
    type: boolean
    default: false
  - name: allowClobber
    type: boolean
    default: false

steps:
  - ${{ if or(contains(parameters.name, '$('), contains(parameters.requiredVersion, '$(')) }}:
    - 'Module name and version must be literal template parameters': error

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $install = @{
          Name = '${{ replace(parameters.name, '''', '''''') }}'
          Scope = 'CurrentUser'
          Force = $true
          AllowClobber = $${{ parameters.allowClobber }}
          ErrorAction = 'Stop'
      }
      if ($install.Name -notmatch '\A[A-Za-z0-9][A-Za-z0-9_.-]*\z') {
          throw 'Invalid PowerShell module name.'
      }
      $module = @{ ModuleName = $install.Name; ModuleVersion = '0.0' }
      $version = '${{ replace(parameters.requiredVersion, '''', '''''') }}'
      if ($version) {
          $install.RequiredVersion = [version] $version
          $module = @{ ModuleName = $install.Name; RequiredVersion = $install.RequiredVersion }
      }
      if ($${{ parameters.skipIfInstalled }} -and
          (Get-Module -ListAvailable -FullyQualifiedName $module)) {
          return
      }
      $install.Repository = & "$(Build.SourcesDirectory)/eng/scripts/Register-SqlClientPSRepository.ps1" `
          -RepositoryName SqlClient
      Install-Module @install
    displayName: Install PowerShell module ${{ parameters.name }}
