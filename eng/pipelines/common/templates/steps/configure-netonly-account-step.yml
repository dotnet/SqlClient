# Invoke setup and cleanup in the same Windows job, with cleanup after the tests.
# The agent must be a local administrator with permission to manage SQL logins.
# Setup publishes netOnlyUser, netOnlyDomain, netOnlySid, netOnlyConnectionString,
# and secret netOnlyPassword.
# No server roles or database users are granted; tests must use master.
parameters:
  - name: mode
    type: string
    default: setup
    values:
      - setup
      - cleanup

  - name: instanceName
    type: string
    default: MSSQLSERVER

  # Must match the SQL listener, not a client alias.
  - name: port
    type: string
    default: '1433'

steps:
  - task: PowerShell@2
    displayName: '${{ parameters.mode }} temporary net-only account [Win]'
    ${{ if eq(parameters.mode, 'cleanup') }}:
      condition: always()
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\eng\scripts\Configure-NetOnlyAccount.ps1'
      # Use .NET Framework's in-box System.Data.SqlClient for local shared-memory SQL setup.
      pwsh: false
      # Single quotes preserve undefined ADO macros as literals for cleanup's absent-value checks.
      arguments: >-
        -Mode '${{ parameters.mode }}'
        -InstanceName '${{ parameters.instanceName }}'
        -Port '${{ parameters.port }}'
        -AccountName '$(netOnlyUser)'
        -AccountSid '$(netOnlySid)'
