# This stage is meant to perform a sanity check of the source code at the current point in time.
# Although the test targets will implicitly build the projects they depend on, this stage allows
# for fast failure of the build if the source code is not in a state that can be built.
#
# This stage will also be used to generate nuget packages based on the current source code. These
# will be uploaded, along with the build output as the artifacts of the build.
#
# Developer notes ---
# * Because we want a single artifact for build output, and we want to minimize overhead for build,
#   we build all packages as a single job rather than one job per package.
# * Although theoretically in package build we could arrange build steps to minimize re-building,
#   build.proj isn't properly aware of how to do this. So, instead, arranging the build steps
#   alphabetically is the best way to arrange for now.

parameters:

  # Configuration with which to build the packages and execute the tests.
  - name: buildConfiguration
    type: string
    values:
      - Debug
      - Release

  # Suffix to append to the package version to indicate it is a pre-release/development build.
  - name: buildSuffix
    type: string

  # Name to use for the stage. This is parameterized to allow a higher level of the pipeline to
  # define the name and pass it to sibling stages (ie, test stage) and avoid relying on brittle
  # hard-coded stage names.
  - name: stageName
    type: string

  # Base name of the artifact to publish the build output to. The job attempt number is appended
  # to this to prevent collision across re-runs of the job.
  - name: packArtifactBaseName
    type: string

  # The name of the 1ES pool to run in.
  - name: poolName
    type: string

  # The name of the VM image to run on, within the pool.
  - name: poolImage
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: Build and Pack Projects
    dependsOn: []

    jobs:
      - job: pack_job
        displayName: Build and Pack Projects

        pool:
          name: ${{ parameters.poolName }}

          demands:
            - imageOverride -equals ${{ parameters.poolImage }}

        steps:
          ##################################################################
          # 1) Setup for build/pack

          # 1a) Install dotnet
          - template: /eng/pipelines/common/steps/install-dotnet.yml@self

          # 1b) Restore dotnet tools
          - template: /eng/pipelines/common/steps/restore-dotnet-tools.yml@self

          # ################################################################
          # 2) Build and pack

          # 2a) Build/Pack Microsoft.Data.SqlClient
          - template: /eng/pipelines/pr/steps/pack-buildproj-step.yml
            parameters:
              condition: succeeded() # Only run if dotnet was installed successfully

              buildConfiguration: ${{ parameters.buildConfiguration }}
              buildSuffix: ${{ parameters.buildSuffix }}
              packageShortName: SqlClient

          # 2b) Build/Pack Microsoft.Data.SqlClient.AlwaysEncrypted.AzureKeyVaultProvider
          - template: /eng/pipelines/pr/steps/pack-buildproj-step.yml
            parameters:
              condition: succeededOrFailed()

              buildConfiguration: ${{ parameters.buildConfiguration }}
              buildSuffix: ${{ parameters.buildSuffix }}
              packageShortName: AkvProvider

          # 2c) Build/Pack Microsoft.Data.SqlClient.Extensions.Abstractions
          - template: /eng/pipelines/pr/steps/pack-buildproj-step.yml
            parameters:
              condition: succeededOrFailed()

              buildConfiguration: ${{ parameters.buildConfiguration }}
              buildSuffix: ${{ parameters.buildSuffix }}
              packageShortName: Abstractions

          # 2d) Build/Pack Microsoft.Data.SqlClient.Extensions.Azure
          - template: /eng/pipelines/pr/steps/pack-buildproj-step.yml
            parameters:
              condition: succeededOrFailed()

              buildConfiguration: ${{ parameters.buildConfiguration }}
              buildSuffix: ${{ parameters.buildSuffix }}
              packageShortName: Azure

          # 2e) Build/Pack Microsoft.Data.SqlClient.Internal.Logging
          - template: /eng/pipelines/pr/steps/pack-buildproj-step.yml
            parameters:
              condition: succeededOrFailed()

              buildConfiguration: ${{ parameters.buildConfiguration }}
              buildSuffix: ${{ parameters.buildSuffix }}
              packageShortName: Logging

          # 2f) Build/Pack Microsoft.SqlServer.Server
          - template: /eng/pipelines/pr/steps/pack-buildproj-step.yml
            parameters:
              condition: succeededOrFailed()

              buildConfiguration: ${{ parameters.buildConfiguration }}
              buildSuffix: ${{ parameters.buildSuffix }}
              packageShortName: SqlServer

          ##################################################################
          # 3) Log the build output

          # 3a) Emit the build output
          - template: /eng/pipelines/common/templates/steps/output-tree-step.yml@self
            parameters:
              condition: succeededOrFailed()

              path: $(BUILD_OUTPUT)

          # 3b) Upload the build output as the artifact of the job.
          #
          # The artifact name includes the job attempt number because pipeline artifact names must
          # be unique within a build. Re-running a failed job would otherwise attempt to publish
          # an artifact that already exists and fail with:
          #   "Artifact build_and_pack_projects already exists for build <id>."
          - publish: $(BUILD_OUTPUT)
            artifact: ${{ parameters.packArtifactBaseName }}_${{ parameters.buildConfiguration }}_attempt$(System.JobAttempt)
            displayName: Publish Build Output
            condition: succeededOrFailed()

          ##################################################################
          # 4) Verify the nuget packages
          - template: /eng/pipelines/common/templates/steps/verify-nuget-package-step.yml@self
            parameters:
              packagePath: $(BUILD_OUTPUT)
