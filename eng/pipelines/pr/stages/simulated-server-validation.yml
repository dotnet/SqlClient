parameters:
  - name: poolName
    type: string
  - name: repetitions
    type: number
  - name: legs
    type: object
    default:
      - name: windows_net462_native
        framework: net462
        managed: false
        image: ADO-MMS25-SQL25
      - name: windows_net10_native
        framework: net10.0
        managed: false
        image: ADO-MMS25-SQL25
      - name: windows_net10_managed
        framework: net10.0
        managed: true
        image: ADO-MMS25-SQL25
      - name: linux_net10_managed
        framework: net10.0
        managed: true
        image: ADO-UB24-SQL25

stages:
  - stage: simulated_servers
    jobs:
      - ${{ each leg in parameters.legs }}:
        - job: ${{ leg.name }}
          timeoutInMinutes: 90
          pool:
            name: ${{ parameters.poolName }}
            demands:
              - imageOverride -equals ${{ leg.image }}
          steps:
            - template: /eng/pipelines/common/steps/install-dotnet.yml@self
            - template: /eng/pipelines/common/steps/restore-dotnet-tools.yml@self
            - task: PowerShell@2
              displayName: Repeat simulator tests (no retries)
              inputs:
                pwsh: true
                filePath: eng/pipelines/pr/steps/test-simulated-servers.ps1
                arguments: >-
                  -Framework ${{ leg.framework }}
                  -ManagedSni ${{ leg.managed }}
                  -Repetitions ${{ parameters.repetitions }}
                  -ResultsPath "$(Build.SourcesDirectory)/test_results/${{ leg.name }}"
            - template: /eng/pipelines/pr/steps/publish-test-results-step.yml@self
              parameters:
                buildConfiguration: Debug
                platformDisplayName: ${{ leg.name }}
                testDisplayName: simulated_servers
                testResultsArtifactBaseName: simulated_servers
                testResultsPath: "$(Build.SourcesDirectory)/test_results/${{ leg.name }}"
